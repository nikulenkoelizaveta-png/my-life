<style>
/* Layout: frosted rounded cards floating on a sky-to-sand gradient. Tabs are pills, the month grid sits left, the chosen day right; one column on a phone. */
:root{
  --bg:#E4E2DF; --g1:#C7D5E2; --g2:#E6E4E1; --g3:#E8D9C5;
  --glass:rgba(255,255,255,.58); --glass-line:rgba(255,255,255,.75); --tile:rgba(255,255,255,.62); --surface:#F1F0EE;
  --ink:#1E2328; --muted:#5B6168; --line:rgba(30,35,40,.12);
  --blue:#9DB4CB; --blue-ink:#182330; --accent:#3A6FB5; --pill:#25282C; --pill-ink:#FFFFFF; --warn:#A63A2E;
  --c-task:#3A6FB5; --c-cycle:#B84C7A; --c-date:#A87A1E; --c-pay:#3E8562; --c-eng:#7B5FB0;
  --flow-bg:rgba(184,76,122,.18); --z-calm:rgba(62,133,98,.16); --z-mid:rgba(168,122,30,.16); --z-high:rgba(184,76,122,.18); --s1:#3A6FB5; --s2:#B84C7A; --s3:#A87A1E;
  --display:"Geologica",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Geologica",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#20242B; --g1:#1A2331; --g2:#22252B; --g3:#2C2722;
  --glass:rgba(255,255,255,.07); --glass-line:rgba(255,255,255,.10); --tile:rgba(255,255,255,.07); --surface:#262A31;
  --ink:#ECE8E2; --muted:#A3A7AD; --line:rgba(255,255,255,.13);
  --blue:#4E6A87; --blue-ink:#F2F5F8; --accent:#7FA6DD; --pill:#ECE8E2; --pill-ink:#1B1E22; --warn:#F09A8E;
  --c-task:#5A8AD0; --c-cycle:#C4608A; --c-date:#A98420; --c-pay:#58A882; --c-eng:#A088D6;
  --flow-bg:rgba(196,96,138,.26); --z-calm:rgba(88,168,130,.18); --z-mid:rgba(169,132,32,.20); --z-high:rgba(196,96,138,.24); --s1:#5A8AD0; --s2:#C4608A; --s3:#A98420; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#20242B; --g1:#1A2331; --g2:#22252B; --g3:#2C2722;
  --glass:rgba(255,255,255,.07); --glass-line:rgba(255,255,255,.10); --tile:rgba(255,255,255,.07); --surface:#262A31;
  --ink:#ECE8E2; --muted:#A3A7AD; --line:rgba(255,255,255,.13);
  --blue:#4E6A87; --blue-ink:#F2F5F8; --accent:#7FA6DD; --pill:#ECE8E2; --pill-ink:#1B1E22; --warn:#F09A8E;
  --c-task:#5A8AD0; --c-cycle:#C4608A; --c-date:#A98420; --c-pay:#58A882; --c-eng:#A088D6;
  --flow-bg:rgba(196,96,138,.26); --z-calm:rgba(88,168,130,.18); --z-mid:rgba(169,132,32,.20); --z-high:rgba(196,96,138,.24); --s1:#5A8AD0; --s2:#C4608A; --s3:#A98420; color-scheme:dark }

*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg) linear-gradient(180deg,var(--g1) 0%,var(--g2) 48%,var(--g3) 100%) fixed;min-height:100vh;color:var(--ink);font:300 15px/1.5 var(--body);padding-inline:16px;padding-block:28px 56px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:32px;font-weight:300;letter-spacing:-.02em;line-height:1.1}
h1 b{font-weight:600}
h2{font-size:22px;font-weight:300;letter-spacing:-.01em}
h3{font-size:15px;font-weight:600}
p{margin:0} b{font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
#status{font-size:13px;color:var(--muted)}
#status.err{color:var(--warn)}
.tabs-scroll{overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.tabs{display:flex;gap:6px;min-width:max-content;background:var(--glass);border:1px solid var(--glass-line);border-radius:999px;padding:5px;width:max-content;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.tab{font:400 14px var(--body);color:var(--ink);background:none;border:0;border-radius:999px;padding:9px 16px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--pill);color:var(--pill-ink)}

button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--tile);border:1px solid var(--glass-line);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:400}
.btn:hover{border-color:var(--muted)}
.btn.primary,.btn.on{background:var(--pill);border-color:var(--pill);color:var(--pill-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:4px 8px}
.btn.ghost:hover{color:var(--warn)}
.btn.round{width:40px;height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{background:var(--tile);border:1px solid var(--glass-line);border-radius:16px;padding:9px 14px;min-width:0;width:100%}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
textarea{resize:vertical;min-height:72px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--pill);flex:none}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0;flex:1 1 120px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.row>.grow{flex:1 1 160px;min-width:0}
.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}

.panel{background:var(--glass);border:1px solid var(--glass-line);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.sec{display:flex;flex-direction:column;gap:10px}
#view{display:flex;flex-direction:column;gap:18px}
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
@media (max-width:820px){.split,.cols{grid-template-columns:minmax(0,1fr)}.panel{padding:18px;border-radius:24px}h1{font-size:28px}}

.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.calhead h2{min-width:150px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--glass-line);background:var(--tile);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="false"]{color:var(--muted);background:none;text-decoration:line-through}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--muted)}
.d-task{background:var(--c-task)} .d-cycle{background:var(--c-cycle)} .d-date{background:var(--c-date)} .d-pay{background:var(--c-pay)} .d-eng{background:var(--c-eng)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{font-size:12px;color:var(--muted);text-align:center;padding:2px 0}
.cell{position:relative;background:var(--tile);border:1px solid transparent;border-radius:16px;min-height:64px;padding:7px 8px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden;min-width:0}
.cell.out{visibility:hidden}
.cell .n{font:400 14px var(--display);font-variant-numeric:tabular-nums}
.cell.today .n{background:var(--pill);color:var(--pill-ink);border-radius:999px;padding:1px 7px;align-self:flex-start;margin:-1px 0 0 -3px}
.cell.sel{background:var(--blue);color:var(--blue-ink)}
.cell.sel .lines{color:var(--blue-ink)}
.cell.flow{background:var(--flow-bg)}
.cell.flow.sel{background:var(--blue)}
.cell.flow::after,.cell.pred::after{content:"";position:absolute;left:10px;right:10px;bottom:4px;height:3px;border-radius:2px;background:var(--c-cycle)}
.cell.pred::after{background:none;border-bottom:2px dashed var(--c-cycle);height:0}
.dots{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.lines{display:flex;flex-direction:column;gap:1px;font-size:11px;line-height:1.25;color:var(--muted)}
.lines span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark{font:600 13px var(--display)}
@media (max-width:720px){.lines{display:none}.cell{min-height:48px;padding:5px 5px 9px;border-radius:12px}.grid{gap:4px}}
@media (min-width:721px){.cell.rich .dots{display:none}.cell.rich{min-height:88px}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sw{width:18px;height:10px;border-radius:3px;background:var(--flow-bg);border-bottom:3px solid var(--c-cycle)}
.sw.p{background:none;height:0;border-radius:0;border-bottom:2px dashed var(--c-cycle)}

.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.list li:first-child{border-top:0}
.list .t{flex:1;min-width:0;overflow-wrap:anywhere}
.list .done{color:var(--muted);text-decoration:line-through}
.empty{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--tile);border-radius:20px;padding:14px 16px}
.stat:first-child{background:var(--blue);color:var(--blue-ink)}
.stat:first-child span{color:var(--blue-ink)}
.stat b{font:600 24px/1.15 var(--display);letter-spacing:-.01em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{font-size:12px;color:var(--muted)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 12px 8px 0;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:12px;font-weight:400;color:var(--muted);border-top:0}
td.wrapc{white-space:normal;overflow-wrap:anywhere}
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;display:flex;gap:10px;align-items:baseline}
summary .t{flex:1;min-width:0;font-weight:400}
.note{white-space:pre-wrap;overflow-wrap:anywhere;padding-top:8px}
.banner{background:var(--tile);border-radius:20px;padding:12px 16px;font-size:13px}
svg.ch{display:block;width:100%;height:auto;max-width:100%}
svg.ch text{font:300 12px var(--body);fill:var(--muted);font-variant-numeric:tabular-nums}
svg.ch text.v{fill:var(--ink);font-weight:600}
svg.ch .hit{fill:transparent;cursor:pointer;outline:none}
svg.ch .hit:focus-visible{stroke:var(--accent);stroke-width:2}
.chartbox{display:flex;flex-direction:column;gap:8px;min-width:0}
.chartbox h4{font:600 15px var(--display)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.lg span{display:inline-flex;gap:6px;align-items:center}
.lg i{width:12px;height:3px;border-radius:2px}
.pivot th:first-child,.pivot td:first-child{position:sticky;left:0;background:var(--surface);padding-left:2px;z-index:1}
.pivot td,.pivot th{text-align:right}
.pivot th:first-child,.pivot td:first-child{text-align:left}
.pivot td.ref{color:var(--muted)}
.over{color:var(--warn)}
.phead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted);white-space:nowrap}
.meter{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px;background:var(--accent);min-width:0}
.goalrow{display:flex;flex-direction:column;gap:6px}
.goalrow .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.goalrow .hd b{font-variant-numeric:tabular-nums}
.gcard{background:var(--tile);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.gcard h4{font:600 17px var(--display);overflow-wrap:anywhere}
.gcard.done h4{text-decoration:line-through;color:var(--muted)}
.ringrow{display:flex;gap:14px;align-items:center}
svg.ring{width:64px;height:64px;flex:none}
svg.ring text{font:600 15px var(--display);fill:var(--ink)}
.sum{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.menu{position:relative;align-self:flex-start;min-width:240px;max-width:100%}
.menu-btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--pill);color:var(--pill-ink);border:0;border-radius:999px;padding:12px 20px;font:400 16px var(--body);cursor:pointer}
.menu-list{position:absolute;top:calc(100% + 6px);left:0;z-index:5;min-width:100%;background:var(--surface);border:1px solid var(--glass-line);border-radius:22px;padding:6px;display:flex;flex-direction:column;box-shadow:0 14px 36px rgba(0,0,0,.16)}
.menu-list button{text-align:left;background:none;border:0;border-radius:16px;padding:11px 14px;font:400 15px var(--body);cursor:pointer}
.menu-list button[aria-selected="true"]{background:var(--blue);color:var(--blue-ink)}
input[type=file]{font-size:13px;max-width:100%}
input[type=file]::file-selector-button{font:inherit;background:var(--tile);color:var(--ink);border:1px solid var(--glass-line);border-radius:999px;padding:7px 14px;margin-right:10px;cursor:pointer}
.board{columns:2;column-gap:10px}
@media (min-width:821px){.board{columns:4}}
.vcard{break-inside:avoid;margin:0 0 10px;border-radius:20px;overflow:hidden;background:var(--tile);display:flex;flex-direction:column}
.vcard img{display:block;width:100%;height:auto}
.vcard .cap{padding:8px 12px 2px;font-size:13px;overflow-wrap:anywhere}
.vcard.txt{background:var(--blue);color:var(--blue-ink)}
.vcard.txt .cap{font:300 17px/1.3 var(--display);padding:18px 14px 6px}
.vcard .btn.ghost{align-self:flex-end;color:inherit;opacity:.7}
summary.gsum{align-items:center;list-style:none}
summary.gsum::-webkit-details-marker{display:none}
summary.gsum::after{content:"▾";color:var(--muted)}
details[open]>summary.gsum::after{content:"▴"}
.gbody{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.slider{display:flex;flex-direction:column;gap:6px}
.slider .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slider .hd b{font:600 22px var(--display);font-variant-numeric:tabular-nums}
.slider input[type=range]{width:100%;accent-color:var(--pill);height:28px}
.slider .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.zone{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600}
.z-calm{background:var(--z-calm);color:var(--ink)} .z-mid{background:var(--z-mid);color:var(--ink)} .z-high{background:var(--z-high);color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding-top:6px}
.tools .muted{width:100%;text-align:center}
.login{max-width:420px;margin:0 auto;width:100%}
.stats.three b{font-size:18px;white-space:nowrap}
.seg{display:flex;gap:4px;background:var(--glass);border:1px solid var(--glass-line);border-radius:999px;padding:4px}
.seg button{flex:1 1 0;min-width:0;background:none;border:0;border-radius:999px;padding:9px 6px;font:400 14px/1.2 var(--body);cursor:pointer;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--pill);color:var(--pill-ink)}
.inc{background:var(--tile);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.inc .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.inc .hd b{font:600 17px var(--display);font-variant-numeric:tabular-nums}
.inc .out{display:flex;gap:10px;align-items:center;font-size:14px;min-width:0}
.inc .out .t{flex:1;min-width:0;overflow-wrap:anywhere}
.inc .free{font-size:13px;color:var(--muted)}
.inc details summary{font-size:13px;color:var(--accent);list-style:none}
.inc details summary::-webkit-details-marker{display:none}
#tip{position:fixed;z-index:10;pointer-events:none;background:var(--pill);color:var(--pill-ink);font-size:12px;padding:6px 10px;border-radius:12px;max-width:240px}
</style>

<div class="wrap">
  <div class="top">

</div>
<div id="tip" hidden></div>

<script>

  wallet:{rub:0,usd:0,eur:0,cny:0,rUsd:0,rEur:0,rCny:0,debt:0,debtPay:0,debtDay:0,debtPaid:{},debtLog:[],gRub:0,gUsd:0,gEur:0,gCny:0},

function idle(){return !KEYS.some(k=>writing[k]||dirty[k])}
function persist(k){
  if(mode!=='cloud')return;
  if(writing[k]){dirty[k]=1;return}
  writing[k]=1;setStatus('Сохраняю…');
  sb.from('docs').upsert({user_id:uidSb,key:k,data:clone(S[k]),updated_at:new Date().toISOString()}).then(({error})=>{
    writing[k]=0;
    if(error){dirty[k]=0;setStatus(navigator.onLine?'Не удалось сохранить. Обновите страницу и повторите.':'Нет интернета, запись не сохранена.',true);return}
    if(dirty[k]){dirty[k]=0;persist(k)}else if(idle())setStatus('Сохранено')});
}

/* ---------- derived ---------- */
function cycleStats(){
  const days=S.cycle.days,ds=Object.keys(days).filter(k=>days[k]&&days[k].flow).sort(),runs=[];
  ds.forEach(d=>{const r=runs[runs.length-1];if(r&&diff(r.end,d)<=1)r.end=d;else runs.push({start:d,end:d})});
  const lens=[];for(let i=1;i<runs.length;i++){const l=diff(runs[i-1].start,runs[i].start);if(l>=15&&l<=60)lens.push(l)}
  const lastL=lens.slice(-6),avg=lastL.length?Math.round(lastL.reduce((a,b)=>a+b,0)/lastL.length):null;
  const lr=runs.slice(-6),pl=lr.length?Math.round(lr.reduce((a,r)=>a+diff(r.start,r.end)+1,0)/lr.length):null;
  const last=runs.length?runs[runs.length-1].start:null,pred=new Set();let next=null;
  if(avg&&last){next=addDays(last,avg);for(let i=1;i<=4;i++){const st=addDays(last,avg*i);for(let j=0;j<(pl||1);j++)pred.add(addDays(st,j))}}
  return {runs,avg,pl,last,next,pred,lens};
}
function paysOn(s){
  const d=parse(s),n=dim(d.getFullYear(),d.getMonth()),ym=s.slice(0,7),out=[];
  S.payments.items.forEach(p=>{
    if(p.kind==='once'){if(p.date===s)out.push({id:p.id,title:p.title,amount:p.amount,key:'once',paid:!!(p.paid&&p.paid.once)})}
    else if(Math.min(p.day,n)===d.getDate())out.push({id:p.id,title:p.title,amount:p.amount,key:ym,paid:!!(p.paid&&p.paid[ym])});
  });
  const w=S.wallet;
  if(w.debtPay>0&&w.debtDay>0&&Math.min(w.debtDay,n)===d.getDate())out.push({id:'credit',title:'Платёж по кредиту',amount:w.debtPay,key:ym,paid:!!(w.debtPaid&&w.debtPaid[ym])});
  return out;
}
function datesOn(s){return S.dates.items.filter(x=>x.yearly?x.date.slice(5)===s.slice(5):x.date===s)}
function stepsOn(s){const o=[];S.goals.items.forEach(g=>(g.steps||[]).forEach(x=>{if(x.due===s)o.push({g:g,x:x})}));return o}
function hwOn(s){return (S.english.hw||[]).filter(x=>x.due===s)}
function tasksOn(s){return S.tasks.items.filter(t=>t.date===s).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'))}

function monthGrid(kind){
  const y=cur[0],m=cur[1],off=(new Date(y,m,1).getDay()+6)%7,n=dim(y,m),t=today();
  let h='<div class="grid">'+WD.map((w,i)=>'<div class="wd">'+w+'</div>').join('');
  for(let i=0;i<off;i++)h+='<div class="cell out"></div>';
  for(let d=1;d<=n;d++){
    const s=iso(y,m,d),c=S.cycle.days[s],e=S.english.days[s];let cls='cell',dots='',lines=[],label=d+' '+MONG[m];
    if(s===t)cls+=' today';if(s===sel)cls+=' sel';
    const showC=kind==='cycle'||(kind==='all'&&layers.has('cycle'));
    if(showC){if(c&&c.flow){cls+=' flow';label+=', месячные'}else if(CS.pred.has(s)&&s>=t){cls+=' pred';label+=', прогноз месячных'}}
    if(kind==='cycle'&&c&&((c.sym&&c.sym.length)||c.note))dots+='<i class="dot d-cycle" title="Есть пометки"></i>';
    if(kind==='eng')hwOn(s).forEach(x=>{dots+='<i class="dot d-eng"'+(x.done?' style="opacity:.35"':'')+' title="Домашнее задание"></i>'});
    if(kind==='eng'&&e)dots+='<span class="mark" style="color:var('+(e==='yes'?'--c-eng':'--muted')+')">'+(e==='yes'?'✓':'×')+'</span>';
    if(kind==='all'){
      if(layers.has('task')){const ts=tasksOn(s);ts.forEach(x=>{dots+='<i class="dot d-task"'+(x.done?' style="opacity:.35"':'')+'></i>';lines.push(x.title)})}
      if(layers.has('date'))datesOn(s).forEach(x=>{dots+='<i class="dot d-date"></i>';lines.push(x.title)});
      if(layers.has('pay'))paysOn(s).forEach(x=>{dots+='<i class="dot d-pay"'+(x.paid?' style="opacity:.35"':'')+'></i>';lines.push(x.title)});
      if(layers.has('eng'))hwOn(s).forEach(x=>{dots+='<i class="dot d-eng"'+(x.done?' style="opacity:.35"':'')+'></i>';lines.push('ДЗ: '+x.title)});
      if(layers.has('goal'))stepsOn(s).forEach(q=>{dots+='<i class="dot d-cycle"'+(q.x.done?' style="opacity:.35"':'')+'></i>';lines.push(q.x.title)});
      if(lines.length){cls+=' rich';label+=', записей: '+lines.length}
    }
    const more=lines.length>3?lines.length-2:0,shown=more?lines.slice(0,2):lines;
    h+='<button type="button" class="'+cls+'" data-act="pick" data-d="'+s+'" aria-label="'+esc(label)+'"><span class="n">'+d+'</span>'+
      (dots?'<span class="dots">'+dots+'</span>':'')+
      (shown.length?'<span class="lines">'+shown.map(x=>'<span>'+esc(x)+'</span>').join('')+(more?'<span>ещё '+more+'</span>':'')+'</span>':'')+'</button>';
  }
  return h+'</div>';
}

function goalPanel(w){
  const C=[['rub','Рубли','₽',1,w.gRub],['usd','Доллары','$',w.rUsd,w.gUsd],['eur','Евро','€',w.rEur,w.gEur],['cny','Юани','¥',w.rCny,w.gCny]].filter(c=>c[4]>0);
  if(!C.length)return '<section class="panel"><h3>Цель по накоплениям</h3><p class="empty">Цель не задана. Укажите суммы в форме ниже.</p></section>';
  let tot=0,have=0;
  const rows=C.map(c=>{const rate=c[3],t=c[4],cur=w[c[0]]||0,ok=rate>0,hr=ok?Math.min(cur*rate,t):0,pct=ok?Math.min(100,Math.round(cur*rate/t*100)):0,need=ok?t/rate:null,left=ok?Math.max(0,need-cur):null;tot+=t;have+=hr;
    return '<div class="goalrow"><div class="hd"><span>'+c[1]+' <span class="small muted">цель '+fmt(t)+' ₽'+(c[0]!=='rub'&&ok?' ≈ '+fmt(Math.ceil(need))+' '+c[2]+' по курсу '+fmt(rate):'')+'</span></span><b>'+(ok?pct+'%':'—')+'</b></div>'+
      '<div class="meter" role="img" aria-label="'+c[1]+': '+pct+'% цели"><i style="width:'+pct+'%"></i></div>'+
      '<span class="small muted">'+(ok?'есть '+fmt(cur)+' '+c[2]+', осталось '+(left>0?fmt(Math.ceil(left))+' '+c[2]+(c[0]!=='rub'?' (≈ '+fmt(Math.round(left*rate))+' ₽)':''):'0, цель достигнута'):'укажите курс в форме ниже, чтобы посчитать')+'</span></div>'}).join('');
  const tp=tot?Math.round(have/tot*100):0;
  return '<section class="panel"><h3>Цель по накоплениям</h3><div class="stats"><div class="stat"><b>'+fmt(Math.max(0,Math.round(tot-have)))+' ₽</b><span>осталось до цели</span></div><div class="stat"><b>'+tp+'%</b><span>накоплено из '+fmt(tot)+' ₽</span></div></div>'+
    '<div class="goalrow"><div class="hd"><span>Вся цель</span><b>'+tp+'%</b></div><div class="meter" style="height:16px" role="img" aria-label="Вся цель: '+tp+'%"><i style="width:'+tp+'%"></i></div></div>'+rows+'</section>';
}
const wf=(id,l,v,step)=>'<label class="f">'+l+'<input type="number" inputmode="decimal" step="'+(step||'0.01')+'" min="0" id="w-'+id+'" name="'+id+'" value="'+(v||'')+'" placeholder="0"></label>';

function nice(x){const p=Math.pow(10,Math.floor(Math.log10(x))),f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function chart(series,o){
  o=o||{};const all=[];series.forEach(s=>s.pts.forEach(p=>all.push(p)));if(all.length<2)return '';
  const W=o.w||(window.innerWidth<720?340:560),H=o.h||200,L=o.left||40,R=o.right||52,T=16,B=26;
  const ts=all.map(p=>+parse(p.date)),x0=Math.min.apply(null,ts),x1=Math.max.apply(null,ts);
  let lo=Math.min.apply(null,all.map(p=>p.v)),hi=Math.max.apply(null,all.map(p=>p.v));if(lo===hi){lo-=1;hi+=1}
  let st=nice((hi-lo)/3);lo=Math.floor(lo/st+1e-9)*st;hi=Math.ceil(hi/st-1e-9)*st;if(o.fixed){lo=o.fixed[0];hi=o.fixed[1];st=o.fixed[2]}
  const X=d=>L+(x1===x0?.5:(+parse(d)-x0)/(x1-x0))*(W-L-R),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const xl=o.xl||function(d){const q=parse(d),r=all.find(p=>p.date===d);return r&&r.p==='y'?String(q.getFullYear()):MONS[q.getMonth()]+' '+String(q.getFullYear()).slice(2)};
  let g='';(o.bands||[]).forEach(b=>{const y1=Y(b[1]),y0=Y(b[0]);g+='<rect x="'+L+'" y="'+y1.toFixed(1)+'" width="'+(W-L-R)+'" height="'+(y0-y1).toFixed(1)+'" fill="'+b[2]+'"/><text x="'+(W-R+6)+'" y="'+((y0+y1)/2).toFixed(1)+'" dy="4">'+b[3]+'</text>'});
  for(let v=lo;v<=hi+st/2;v+=st){const y=Y(v).toFixed(1);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-8)+'" y="'+y+'" dy="4" text-anchor="end">'+fmt(Math.round(v*100)/100)+'</text>'}
  g+='<text x="'+L+'" y="'+(H-6)+'">'+xl(dIso(new Date(x0)))+'</text>'+(x1>x0?'<text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+xl(dIso(new Date(x1)))+'</text>':'');
  let hits='';
  series.forEach((s,i)=>{const c=s.color||'var(--s'+(i+1)+')',pts=s.pts.slice().sort((a,b)=>a.date.localeCompare(b.date));if(!pts.length)return;
    g+='<polyline fill="none" stroke="'+c+'" stroke-width="2" stroke-linejoin="round" points="'+pts.map(p=>X(p.date).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ')+'"/>';
    pts.forEach((p,k)=>{const x=X(p.date).toFixed(1),y=Y(p.v).toFixed(1),lastP=k===pts.length-1;
      g+='<circle cx="'+x+'" cy="'+y+'" r="'+(lastP?5:4)+'" fill="'+c+'" stroke="var(--surface)" stroke-width="2"/>';
      hits+='<circle class="hit" tabindex="0" cx="'+x+'" cy="'+y+'" r="13" data-tip="'+esc((series.length>1?s.name+', ':'')+when(p)+': '+fmt(p.v)+(o.unit?' '+o.unit:''))+'"/>';
      if(lastP&&!o.noEnd)g+='<text class="v" x="'+(+x+9)+'" y="'+y+'" dy="4">'+fmt(p.v)+'</text>'});
  });
  return '<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'График')+'">'+g+hits+'</svg>'+
    (series.length>1?'<div class="lg">'+series.map((s,i)=>'<span><i style="background:'+(s.color||'var(--s'+(i+1)+')')+'"></i>'+esc(s.name)+'</span>').join('')+'</div>':'');
}
function box(title,sub,html){return '<div class="chartbox"><h4>'+esc(title)+(sub?' <span class="small muted" style="font-weight:400">'+esc(sub)+'</span>':'')+'</h4>'+html+'</div>'}
function bars(cols,series,o){
  o=o||{};const n=cols.length,k=series.length;if(!n)return '';
  const W=o.w||(window.innerWidth<720?340:560),H=o.h||190,L=4,R=4,T=22,B=24;let mx=0;
  series.forEach(s=>s.vals.forEach(v=>{if(v!=null&&v>mx)mx=v}));if(!mx)return '';
  const slot=(W-L-R)/n,bw=Math.max(6,Math.min(30,(slot-12)/k-2)),gw=k*bw+(k-1)*2,base=H-B;
  const xl=o.xl||function(c){const q=parse(c.date);return c.p==='y'?String(q.getFullYear()):MONS[q.getMonth()]+' '+String(q.getFullYear()).slice(2)};
  let g='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+base+'" y2="'+base+'" stroke="var(--line)" stroke-width="1"/>',hits='';
  cols.forEach((c,i)=>{const x0=L+slot*i+(slot-gw)/2;
    g+='<text x="'+(L+slot*i+slot/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+xl(c)+'</text>';
    series.forEach((s,j)=>{const v=s.vals[i];if(v==null)return;const col=s.color||'var(--s'+(j+1)+')',x=x0+j*(bw+2),h=Math.max(2,v/mx*(base-T)),y=base-h,r=Math.min(4,bw/2,h);
      g+='<path fill="'+col+'" d="M'+x.toFixed(1)+' '+base+'V'+(y+r).toFixed(1)+'q0 -'+r+' '+r+' -'+r+'h'+(bw-2*r).toFixed(1)+'q'+r+' 0 '+r+' '+r+'V'+base+'z"/>'+
        '<text class="v" x="'+(x+bw/2).toFixed(1)+'" y="'+(y-5).toFixed(1)+'" text-anchor="middle">'+fmt(v)+'</text>';
      hits+='<rect class="hit" tabindex="0" x="'+x.toFixed(1)+'" y="'+T+'" width="'+bw.toFixed(1)+'" height="'+(base-T)+'" data-tip="'+esc((k>1?s.name+', ':'')+when(c)+': '+fmt(v)+(o.unit?' '+o.unit:''))+'"/>'})});
  return '<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'Диаграмма')+'">'+g+hits+'</svg>'+
    (k>1?'<div class="lg">'+series.map((s,j)=>'<span><i style="background:var(--s'+(j+1)+');height:8px;border-radius:2px"></i>'+esc(s.name)+'</span>').join('')+'</div>':'');
}

  const mt=S.home.meters.slice().sort((a,b)=>b.date.localeCompare(a.date));
  return '<div class="cols"><section class="panel">'+calHead()+
    '<div class="stats"><div class="stat"><b>'+fmt(sum)+' ₽</b><span>к оплате за месяц</span></div><div class="stat"><b>'+fmt(paid)+' ₽</b><span>оплачено</span></div><div class="stat"><b>'+fmt(sum-paid)+' ₽</b><span>осталось</span></div></div>'+
    (due.length?'<ul class="list">'+due.map(p=>'<li><input type="checkbox" id="hp-'+p.id+'-'+p.key+'" data-act="pay" data-id="'+p.id+'" data-key="'+p.key+'"'+(p.paid?' checked':'')+' aria-label="Оплачено: '+esc(p.title)+'"><span class="num muted">'+p.d+' '+MONG[m]+'</span><span class="t'+(p.paid?' done':'')+'">'+esc(p.title)+'</span><span class="num">'+(p.amount?fmt(p.amount)+' ₽':'')+'</span></li>').join('')+'</ul>':'<p class="empty">На '+MON[m].toLowerCase()+' платежей нет.</p>')+'</section>'+
    '<section class="panel"><form data-form="payment" class="sec"><h3>Новый платёж</h3><div class="row"><label class="f" style="flex-basis:180px">Название<input type="text" id="p-title" name="title" placeholder="Электричество" required></label><label class="f">Сумма, ₽<input type="number" inputmode="decimal" step="0.01" min="0" id="p-amount" name="amount"></label></div>'+
    '<div class="row"><label class="f">Каждый месяц, число<input type="number" step="1" min="1" max="31" id="p-day" name="day" placeholder="10"></label><label class="f">или один раз, дата<input type="date" id="p-date" name="date"></label></div><div><button class="btn primary">Добавить</button></div></form>'+
    '<div class="sec"><h3>Все платежи</h3>'+(S.payments.items.length?'<ul class="list">'+S.payments.items.map(p=>'<li><span class="t">'+esc(p.title)+' <span class="small muted">'+(p.kind==='once'?human(p.date):'каждое '+p.day+'-е число')+'</span></span><span class="num">'+(p.amount?fmt(p.amount)+' ₽':'')+'</span>'+del('payments',p.id)+'</li>').join('')+'</ul>':'<p class="empty">Добавьте квартплату, свет, интернет и другие регулярные платежи. Они появятся в календаре в нужные дни.</p>')+'</div></section></div>'+
    '<div class="cols"><section class="panel"><form data-form="meter" class="sec"><h3>Показания счётчиков</h3><div class="row"><label class="f">Дата<input type="date" id="mt-date" name="date" value="'+today()+'" required></label><label class="f">Счётчик<input type="text" id="mt-name" name="name" list="meter-names" placeholder="Холодная вода" required></label><label class="f">Показание<input type="number" inputmode="decimal" step="any" id="mt-value" name="value" required></label><button class="btn primary">Записать</button></div><datalist id="meter-names"><option value="Холодная вода"><option value="Горячая вода"><option value="Электричество"><option value="Газ"></datalist></form>'+
    (mt.length?'<div class="tbl"><table><tr><th>Дата</th><th>Счётчик</th><th>Показание</th><th></th></tr>'+mt.slice(0,40).map(x=>'<tr><td>'+human(x.date)+'</td><td class="wrapc">'+esc(x.name)+'</td><td>'+fmt(x.value)+'</td><td>'+del('meters',x.id)+'</td></tr>').join('')+'</table></div>':'<p class="empty">Показаний пока нет.</p>')+'</section>'+
    '<section class="panel"><form data-form="homenotes" class="sec"><h3>Заметки по квартире</h3><textarea id="home-notes" name="notes" style="min-height:160px" placeholder="Лицевые счета, телефон управляющей компании, что нужно починить">'+esc(S.home.notes)+'</textarea><div><button class="btn primary">Сохранить</button></div></form></section></div>';
}

function render(){
  $('#menu-cur').textContent=(TABS.find(t=>t[0]===tab)||TABS[0])[1];$('#menu-list').innerHTML=TABS.map(t=>'<button type="button" role="option" data-act="tab" data-k="'+t[0]+'" aria-selected="'+(t[0]===tab)+'">'+t[1]+'</button>').join('');
  if(!ready)return;
  CS=cycleStats();
  const v={cal:vCal,mood:vMood,sleep:vSleep,inbox:vInbox,goals:vGoals,cycle:vCycle,eng:vEng,money:vMoney,health:vHealth,home:vHome}[tab]();
  $('#view').innerHTML=v;
  document.querySelectorAll('.tbl.end').forEach(e=>{e.scrollLeft=e.scrollWidth});
}

/* ---------- events ---------- */
function setCycle(fn){const d=S.cycle.days,c=Object.assign({},d[sel]||{});fn(c);if(!c.flow)delete c.flow;if(c.sym&&!c.sym.length)delete c.sym;if(!c.note)delete c.note;if(Object.keys(c).length)d[sel]=c;else delete d[sel];commit('cycle')}
let armed=null;
document.addEventListener('click',e=>{
  const ml=$('#menu-list'),mb=$('#menu-btn'),b=e.target.closest('[data-act]');
  if(!b||b.dataset.act!=='menu'){ml.hidden=true;mb.setAttribute('aria-expanded','false')}
  if(!b||b.tagName==='INPUT')return;const a=b.dataset.act;
  if(a==='backup'){backup();return}
  if(a==='logout'){sb.auth.signOut().then(()=>{KEYS.forEach(k=>{S[k]=clone(DEF[k])});showLogin()});return}
  if(a==='restore-no'){pendingRestore=null;renderTools();return}
  if(a==='restore-yes'){const d=pendingRestore.data;pendingRestore=null;KEYS.forEach(k=>{if(d[k]){S[k]=merge(k,d[k]);persist(k)}});renderTools();render();return}
  if(a==='menu'){ml.hidden=!ml.hidden;mb.setAttribute('aria-expanded',String(!ml.hidden));return}
  if(a==='tab'){tab=b.dataset.k;ls.set('lp:tab',tab);try{history.replaceState(null,'','#'+tab)}catch(x){}render();return}
  if(!ready)return;
  if(a==='prev'||a==='next'){const d=new Date(cur[0],cur[1]+(a==='next'?1:-1),1);cur=[d.getFullYear(),d.getMonth()];render()}
  else if(a==='today'){sel=today();const d=parse(sel);cur=[d.getFullYear(),d.getMonth()];render()}
  else if(a==='pick'){sel=b.dataset.d;const d=parse(sel);cur=[d.getFullYear(),d.getMonth()];render()}
  else if(a==='ftab'){ftab=b.dataset.k;ls.set('lp:ftab',ftab);render()}
  else if(a==='pmprev'||a==='pmnext'){const d=new Date(+pm.slice(0,4),+pm.slice(5,7)-1+(a==='pmnext'?1:-1),1);pm=dIso(d).slice(0,7);render()}
  else if(a==='pmnow'){pm=today().slice(0,7);render()}
  else if(a==='delout'){const x=S.plan.items.find(q=>q.id===b.dataset.id);if(x){x.out=(x.out||[]).filter(z=>z.id!==b.dataset.o);commit('plan')}}
  else if(a==='edith'){editH=!editH;render()}
  else if(a==='wprev'||a==='wnext'){wk=addDays(wk,a==='wnext'?7:-7);render()}
  else if(a==='wnow'){wk=null;render()}
  else if(a==='openplan'){selGoal=b.dataset.id;tab='plan';ls.set('lp:tab',tab);render();window.scrollTo(0,0)}
  else if(a==='flow'){const v=+b.dataset.v;setCycle(c=>{c.flow=v})}
  else if(a==='sym'){const v=b.dataset.v;setCycle(c=>{const s=new Set(c.sym||[]);s.has(v)?s.delete(v):s.add(v);c.sym=Array.from(s)})}
  else if(a==='eng'){const v=b.dataset.v;if(v)S.english.days[sel]=v;else delete S.english.days[sel];commit('english')}
  else if(a==='move'){const t=S.tasks.items.find(x=>x.id===b.dataset.id);if(t){t.date=today();commit('tasks')}}
  else if(a==='del'){
    if(armed!==b){if(armed&&armed.isConnected)armed.textContent='Удалить';armed=b;b.textContent='Точно удалить?';setTimeout(()=>{if(armed===b){armed=null;if(b.isConnected)b.textContent='Удалить'}},3500);return}
    armed=null;if(b.dataset.k==='mood'){delete S.mood.days[b.dataset.id];commit('mood');return}
    if(b.dataset.k==='vision'){delVision(b.dataset.id);return}
    if(b.dataset.k==='night'){delete S.sleep.nights[b.dataset.id];commit('sleep');return}
    if(b.dataset.k==='steps'){const g=S.goals.items.find(x=>x.id===b.dataset.g);if(g){g.steps=(g.steps||[]).filter(x=>x.id!==b.dataset.id);commit('goals')}return}
    const p=LISTS[b.dataset.k];S[p[0]][p[1]]=S[p[0]][p[1]].filter(x=>x.id!==b.dataset.id);commit(p[0]);
  }
});
document.addEventListener('change',e=>{
  const b=e.target;if(!ready||!b.dataset)return;if(b.dataset.act==='caltype'){calType=b.value;ls.set('lp:caltype',calType);render();const n=$('#cal-type');if(n)n.focus();return}
  if(b.dataset.act==='restore'){const fl=b.files&&b.files[0];if(!fl)return;fl.text().then(t=>{let j;try{j=JSON.parse(t)}catch(e){j=null}if(!j||j.app!=='my-life'||!j.data){setStatus('Этот файл не похож на копию My Life.',true);return}pendingRestore={data:j.data,when:human(String(j.saved).slice(0,10))};renderTools()});return}
  if(b.dataset.act==='mooddate'){if(b.value){sel=b.value>today()?today():b.value;render()}return}
  if(b.dataset.act==='sched'){if(!b.value)return;const i=S.inbox.items.findIndex(x=>x.id===b.dataset.id);if(i<0)return;const x=S.inbox.items[i];S.inbox.items.splice(i,1);S.tasks.items.push({id:uid(),date:b.value,title:x.text,time:'',done:false});persist('tasks');commit('inbox');setTimeout(()=>{if(idle())setStatus('Поставлено в календарь на '+human(b.value))},600);return}
  if(b.dataset.act==='plangoal'){selGoal=b.value;render();return}
  if(b.type!=='checkbox')return;const a=b.dataset.act;
  if(a==='step'){const g=S.goals.items.find(x=>x.id===b.dataset.g),x=g&&(g.steps||[]).find(y=>y.id===b.dataset.id);if(x){x.done=b.checked;commit('goals')}return}
  if(a==='goaldone'){const g=S.goals.items.find(x=>x.id===b.dataset.id);if(g){g.done=b.checked;commit('goals')}return}
  if(a==='hw'){const t=(S.english.hw||[]).find(x=>x.id===b.dataset.id);if(t){t.done=b.checked;commit('english')}return}
  if(a==='tgl'){const t=S.tasks.items.find(x=>x.id===b.dataset.id);if(t){t.done=b.checked;commit('tasks')}}
  else if(a==='pay'){
    if(b.dataset.id==='credit'){const w=S.wallet;w.debtPaid=w.debtPaid||{};if(b.checked)w.debtPaid[b.dataset.key]=true;else delete w.debtPaid[b.dataset.key];commit('wallet')}
    else{const p=S.payments.items.find(x=>x.id===b.dataset.id);if(p){p.paid=p.paid||{};if(b.checked)p.paid[b.dataset.key]=true;else delete p.paid[b.dataset.key];commit('payments')}}
  }
});
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.g){d.open?openG.add(d.dataset.g):openG.delete(d.dataset.g)}},true);
document.addEventListener('input',e=>{const o=e.target.dataset&&e.target.dataset.out;if(o){const n=document.getElementById(o);if(n)n.textContent=e.target.value}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#menu-list').hidden=true});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  if(f.dataset.form==='login'){const fd=new FormData(f),btn=f.querySelector('button');btn.disabled=true;btn.textContent='Вхожу…';sb.auth.signInWithPassword({email:String(fd.get('email')).trim(),password:String(fd.get('password'))}).then(({data,error})=>{if(error||!data.session){showLogin(error&&/invalid/i.test(error.message)?'Неверная почта или пароль.':'Не получилось войти. Проверьте интернет и повторите.');return}start(data.session)});return}
  if(!ready)return;
  if(f.dataset.form==='vision'){const fd=new FormData(f),fl=fd.get('file'),tx0=String(fd.get('text')||'').trim();addVision(fl&&fl.size?fl:null,tx0);f.reset();return}
  const d=Object.fromEntries(new FormData(f).entries()),k=f.dataset.form,tx=s=>String(s||'').trim();
  if(k==='task'){if(!tx(d.title))return;S.tasks.items.push({id:uid(),date:sel,title:tx(d.title),time:d.time||'',cat:d.cat==='life'?'life':'work',done:false});commit('tasks');const i=$('#task-title');if(i)i.focus()}
  else if(k==='date'){if(!tx(d.title))return;S.dates.items.push({id:uid(),date:sel,title:tx(d.title),yearly:!!d.yearly});commit('dates')}
  else if(k==='cyclenote'){setCycle(c=>{c.note=tx(d.note)})}
  else if(k==='planin'){const v=numv(d.amount);if(!d.date||v==null)return;S.plan.items.push({id:uid(),date:d.date,amount:v,title:tx(d.title),out:[]});pm=d.date.slice(0,7);commit('plan')}
  else if(k==='planout'){const x=S.plan.items.find(q=>q.id===f.dataset.id),v=numv(d.amount);if(!x||v==null||!tx(d.title))return;(x.out=x.out||[]).push({id:uid(),amount:v,title:tx(d.title)});commit('plan')}
  else if(k==='mood'){const c=x=>Math.max(0,Math.min(10,Math.round(numv(d[x])||0)));S.mood.days[sel]={a:c('a'),f:c('f'),s:c('s')};if(tx(d.note))S.mood.days[sel].note=tx(d.note);commit('mood')}
  else if(k==='sleep'){if(!d.date||!d.bed||!d.wake)return;const n={bed:d.bed,wake:d.wake,wakes:Math.max(0,Math.round(numv(d.wakes)||0))};if(d.feel)n.feel=+d.feel;S.sleep.nights[d.date]=n;commit('sleep')}
  else if(k==='inbox'){if(!tx(d.text))return;S.inbox.items.push({id:uid(),text:tx(d.text),kind:d.kind==='idea'?'idea':'task',created:today()});commit('inbox');const i=$('#in-text');if(i)i.focus()}
  else if(k==='goal'){if(!tx(d.title))return;const g={id:uid(),title:tx(d.title),hz:d.hz||'other',due:d.due||'',why:tx(d.why),strategy:'',steps:[],done:false};S.goals.items.push(g);openG.add(g.id);commit('goals')}
  else if(k==='step'){const g=S.goals.items.find(x=>x.id===f.dataset.g);if(!g||!tx(d.title))return;(g.steps=g.steps||[]).push({id:uid(),title:tx(d.title),due:d.due||'',done:false});openG.add(g.id);commit('goals');const i=$('#s-title-'+g.id);if(i)i.focus()}
  else if(k==='strategy'){const g=S.goals.items.find(x=>x.id===selGoal);if(!g)return;g.strategy=tx(d.strategy);commit('goals')}
  else if(k==='hw'){if(!tx(d.title)||!d.due)return;(S.english.hw=S.english.hw||[]).push({id:uid(),title:tx(d.title),due:d.due,done:false});commit('english')}
  else if(k==='wallet'){['rub','usd','eur','cny','debt','debtPay','gRub','gUsd','gEur','gCny','rUsd','rEur','rCny'].forEach(x=>{if(x in d)S.wallet[x]=numv(d[x])||0});if('debtDay' in d)S.wallet.debtDay=Math.min(31,Math.max(0,Math.round(numv(d.debtDay)||0)));if(!('debt' in d)){commit('wallet');return}const lg=S.wallet.debtLog=S.wallet.debtLog||[],srt=lg.slice().sort((a,b)=>a.date.localeCompare(b.date)),lst=srt[srt.length-1];if(!lst||lst.amount!==S.wallet.debt){const td=lg.find(x=>x.date===today()&&!x.p);if(td)td.amount=S.wallet.debt;else lg.push({id:uid(),date:today(),amount:S.wallet.debt})}commit('wallet')}
  else if(k==='measure'){const m={id:uid(),date:d.date||today()};let any=false;['weight','waist','hips','chest'].forEach(x=>{const v=numv(d[x]);if(v!=null){m[x]=v;any=true}});if(!any)return;S.health.measures.push(m);commit('health')}
  else if(k==='height'){S.health.height=numv(d.height)||'';commit('health')}
  else if(k==='lab'){const v=numv(d.value);if(v==null||!tx(d.name))return;S.health.labs.push({id:uid(),date:d.date||today(),name:tx(d.name),value:v,unit:tx(d.unit),ref:tx(d.ref)});commit('health')}
  else if(k==='payment'){
    if(!tx(d.title))return;const day=Math.round(numv(d.day)||0),p={id:uid(),title:tx(d.title),amount:numv(d.amount)||0,paid:{}};
    if(d.date&&!day){p.kind='once';p.date=d.date}else{p.kind='monthly';p.day=Math.min(31,Math.max(1,day||parse(sel).getDate()))}
    S.payments.items.push(p);commit('payments')}
  else if(k==='meter'){const v=numv(d.value);if(v==null||!tx(d.name))return;S.home.meters.push({id:uid(),date:d.date||today(),name:tx(d.name),value:v});commit('home')}
  else if(k==='homenotes'){S.home.notes=tx(d.notes);commit('home')}
});

const tip=$('#tip');
function showTip(el){tip.textContent=el.dataset.tip;tip.hidden=false;const r=el.getBoundingClientRect(),w=tip.offsetWidth;tip.style.left=Math.max(8,Math.min(window.innerWidth-w-8,r.left+r.width/2-w/2))+'px';tip.style.top=Math.max(8,r.top-tip.offsetHeight-4)+'px'}
['pointerover','focusin'].forEach(n=>document.addEventListener(n,e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(el)showTip(el)}));
['pointerout','focusout'].forEach(n=>document.addEventListener(n,e=>{if(e.target.closest&&e.target.closest('[data-tip]'))tip.hidden=true}));
window.addEventListener('scroll',()=>{tip.hidden=true},true);
render();init();
})();
</script>
